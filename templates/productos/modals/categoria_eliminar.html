<!-- Modal Eliminar Categoria -->
<div class="modal-overlay"></div>
<div class="modal-content" id="modal-eliminar-categoria" style="display: none;">
    <div class="modal-header">
        <h3><i class="fas fa-trash"></i> Desactivar Categoria</h3>
        <button class="close-modal" id="close-modal-eliminar-categoria">&times;</button>
    </div>
    <div class="modal-body">
        <div class="confirm-message">
            <p>Estas seguro de desactivar la categoria <strong id="eliminar-categoria-nombre">-</strong>?</p>
            <p class="text-muted">Los productos no se eliminan.</p>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="cerrarModal('modal-eliminar-categoria')">Cancelar</button>
        <button type="button" class="btn btn-danger" id="btn-confirmar-eliminar-categoria">
            <i class="fas fa-trash"></i> Desactivar
        </button>
    </div>
</div>
