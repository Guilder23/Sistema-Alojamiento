<!-- Modal Eliminar Producto -->
<div class="modal-overlay"></div>
<div class="modal-content" id="modal-eliminar-producto" style="display: none;">
    <div class="modal-header">
        <h3><i class="fas fa-trash"></i> Desactivar Producto</h3>
        <button class="close-modal" id="close-modal-eliminar-producto">&times;</button>
    </div>
    <div class="modal-body">
        <div class="confirm-message">
            <p>Estas seguro de desactivar el producto <strong id="eliminar-nombre">-</strong>?</p>
            <p class="text-muted">No se eliminara el historial de ventas.</p>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="cerrarModal('modal-eliminar-producto')">Cancelar</button>
        <button type="button" class="btn btn-danger" id="btn-confirmar-eliminar-producto">
            <i class="fas fa-trash"></i> Desactivar
        </button>
    </div>
</div>
