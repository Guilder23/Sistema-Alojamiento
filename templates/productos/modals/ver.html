<!-- Modal Ver Producto -->
<div class="modal-overlay"></div>
<div class="modal-content" id="modal-ver-producto" style="display: none;">
    <div class="modal-header">
        <h3><i class="fas fa-eye"></i> Detalle de Producto</h3>
        <button class="close-modal" id="close-modal-ver-producto">&times;</button>
    </div>
    <div class="modal-body">
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-tag"></i> Nombre</div>
            <div class="detail-value" id="ver-nombre">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-layer-group"></i> Categoria</div>
            <div class="detail-value" id="ver-categoria">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-sliders-h"></i> Tipo</div>
            <div class="detail-value" id="ver-tipo">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-dollar-sign"></i> Precio</div>
            <div class="detail-value" id="ver-precio">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-boxes"></i> Stock</div>
            <div class="detail-value" id="ver-stock">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-toggle-on"></i> Estado</div>
            <div class="detail-value" id="ver-estado">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-align-left"></i> Descripcion</div>
            <div class="detail-value" id="ver-descripcion">-</div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="cerrarModal('modal-ver-producto')">Cerrar</button>
    </div>
</div>
