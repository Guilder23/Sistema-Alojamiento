<!-- Modal Crear Venta -->
<div class="modal-overlay"></div>
<div class="modal-content" id="modal-crear-venta" style="display: none;">
    <div class="modal-header">
        <h3><i class="fas fa-cash-register"></i> Nueva Venta</h3>
        <button class="close-modal" id="close-modal-crear-venta">&times;</button>
    </div>
    <div class="modal-body">
        <form id="form-crear-venta">
            <div class="form-group">
                <label for="venta-cliente">Cliente <span class="required">*</span></label>
                <select id="venta-cliente" class="form-control" required></select>
                <div class="form-error"></div>
            </div>
            <div class="form-group">
                <label for="venta-metodo">Metodo de Pago</label>
                <select id="venta-metodo" class="form-control">
                    <option value="efectivo">Efectivo</option>
                    <option value="tarjeta">Tarjeta</option>
                    <option value="transferencia">Transferencia</option>
                    <option value="qr">QR</option>
                </select>
            </div>
            <div class="form-group">
                <label>Productos <span class="required">*</span></label>
                <div id="items-venta" class="items-venta"></div>
                <button type="button" class="btn btn-secondary btn-sm" id="btn-agregar-item">
                    <i class="fas fa-plus"></i> Agregar Item
                </button>
            </div>
            <div class="total-venta">
                <span>Total:</span>
                <strong id="venta-total">0.00</strong>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="cerrarModal('modal-crear-venta')">Cancelar</button>
        <button type="submit" form="form-crear-venta" class="btn btn-primary">
            <i class="fas fa-save"></i> Registrar Venta
        </button>
    </div>
</div>
