<!-- Modal Editar Categoria -->
<div class="modal-overlay"></div>
<div class="modal-content" id="modal-editar-categoria" style="display: none;">
    <div class="modal-header">
        <h3><i class="fas fa-pen"></i> Editar Categoria</h3>
        <button class="close-modal" id="close-modal-editar-categoria">&times;</button>
    </div>
    <div class="modal-body">
        <form id="form-editar-categoria">
            <input type="hidden" id="editar-categoria-id">
            <div class="form-group">
                <label for="editar-categoria-nombre">Nombre <span class="required">*</span></label>
                <input type="text" id="editar-categoria-nombre" class="form-control" required>
                <div class="form-error"></div>
            </div>
            <div class="form-group">
                <label for="editar-categoria-descripcion">Descripcion</label>
                <textarea id="editar-categoria-descripcion" class="form-control" rows="3"></textarea>
            </div>
            <div class="form-group checkbox-group">
                <label for="editar-categoria-activo">
                    <input type="checkbox" id="editar-categoria-activo"> Categoria Activa
                </label>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="cerrarModal('modal-editar-categoria')">Cancelar</button>
        <button type="submit" form="form-editar-categoria" class="btn btn-success">
            <i class="fas fa-save"></i> Guardar Cambios
        </button>
    </div>
</div>
