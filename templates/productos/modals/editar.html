<!-- Modal Editar Producto -->
<div class="modal-overlay"></div>
<div class="modal-content" id="modal-editar-producto" style="display: none;">
    <div class="modal-header">
        <h3><i class="fas fa-pen"></i> Editar Producto</h3>
        <button class="close-modal" id="close-modal-editar-producto">&times;</button>
    </div>
    <div class="modal-body">
        <form id="form-editar-producto">
            <input type="hidden" id="editar-id">
            <div class="form-group">
                <label for="editar-nombre">Nombre <span class="required">*</span></label>
                <div class="input-with-icon">
                    <span class="input-icon"><i class="fas fa-tag"></i></span>
                    <input type="text" id="editar-nombre" class="form-control" required>
                </div>
                <div class="form-error"></div>
            </div>
            <div class="form-group">
                <label for="editar-categoria">Categoria <span class="required">*</span></label>
                <div class="input-with-icon">
                    <span class="input-icon"><i class="fas fa-layer-group"></i></span>
                    <select id="editar-categoria" class="form-control" required></select>
                </div>
                <div class="form-error"></div>
            </div>
            <div class="form-group">
                <label for="editar-tipo">Tipo <span class="required">*</span></label>
                <div class="input-with-icon">
                    <span class="input-icon"><i class="fas fa-sliders-h"></i></span>
                    <select id="editar-tipo" class="form-control" required>
                        <option value="producto">Producto</option>
                        <option value="servicio">Servicio</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="editar-precio">Precio de Venta <span class="required">*</span></label>
                <div class="input-with-icon">
                    <span class="input-icon"><i class="fas fa-dollar-sign"></i></span>
                    <input type="number" step="0.01" id="editar-precio" class="form-control" required>
                </div>
                <div class="form-error"></div>
            </div>
            <div class="form-group">
                <label for="editar-codigo">Codigo SKU</label>
                <input type="text" id="editar-codigo" class="form-control">
            </div>
            <div class="form-group">
                <label for="editar-descripcion">Descripcion</label>
                <textarea id="editar-descripcion" class="form-control" rows="3"></textarea>
            </div>
            <div class="stock-grid">
                <div class="form-group">
                    <label for="editar-stock">Stock Actual</label>
                    <input type="number" id="editar-stock" class="form-control" min="0">
                </div>
                <div class="form-group">
                    <label for="editar-stock-minimo">Stock Minimo</label>
                    <input type="number" id="editar-stock-minimo" class="form-control" min="0">
                </div>
            </div>
            <div class="form-group checkbox-group">
                <label for="editar-activo">
                    <input type="checkbox" id="editar-activo"> Producto Activo
                </label>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="cerrarModal('modal-editar-producto')">Cancelar</button>
        <button type="submit" form="form-editar-producto" class="btn btn-success">
            <i class="fas fa-save"></i> Guardar Cambios
        </button>
    </div>
</div>
