{% load static %}

<!-- Modal de registro (misma línea visual que login) -->
<div id="modalRegistro" class="modal-registro">
    <div class="auth-modal-overlay" onclick="closeRegistroModal()"></div>
    <div class="auth-modal-container">
        <div class="auth-modal-card" role="dialog" aria-modal="true" aria-labelledby="registroModalTitle">
            <div class="auth-modal-header">
                <div class="auth-modal-title-section">
                    <h2 id="registroModalTitle" class="auth-modal-title">Crear cuenta</h2>
                    <p class="auth-modal-subtitle">Únete y gestiona tu alojamiento desde un solo lugar</p>
                </div>
                <button type="button" class="auth-modal-close" onclick="closeRegistroModal()" aria-label="Cerrar">
                    <span class="auth-modal-close-x" aria-hidden="true">×</span>
                </button>
            </div>

            <div class="auth-modal-body">
                <form method="post" action="{% url 'autenticacion:registro' %}" class="auth-form" id="registroForm" novalidate>
                    {% csrf_token %}

                    <div class="auth-form-group">
                        <label for="reg_username" class="auth-form-label">Usuario</label>
                        <div class="auth-form-input-wrapper">
                            <svg class="auth-form-input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <input type="text" id="reg_username" name="username" class="auth-form-input" placeholder="elige un usuario" required autocomplete="username">
                        </div>
                        <div class="auth-error-message" id="reg_username-error"></div>
                    </div>

                    <div class="auth-form-group">
                        <label for="reg_email" class="auth-form-label">Correo electrónico</label>
                        <div class="auth-form-input-wrapper">
                            <svg class="auth-form-input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                            </svg>
                            <input type="email" id="reg_email" name="email" class="auth-form-input" placeholder="correo@ejemplo.com" required autocomplete="email">
                        </div>
                        <div class="auth-error-message" id="reg_email-error"></div>
                    </div>

                    <div class="auth-form-group">
                        <label for="reg_password1" class="auth-form-label">Contraseña</label>
                        <div class="auth-form-input-wrapper">
                            <svg class="auth-form-input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" id="reg_password1" name="password1" class="auth-form-input" placeholder="Mínimo 8 caracteres" required autocomplete="new-password">
                        </div>
                        <div class="auth-error-message" id="reg_password1-error"></div>
                    </div>

                    <div class="auth-form-group">
                        <label for="reg_password2" class="auth-form-label">Confirmar contraseña</label>
                        <div class="auth-form-input-wrapper">
                            <svg class="auth-form-input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                            <input type="password" id="reg_password2" name="password2" class="auth-form-input" placeholder="Repite la contraseña" required autocomplete="new-password">
                        </div>
                        <div class="auth-error-message" id="reg_password2-error"></div>
                    </div>

                    <button type="submit" class="auth-btn-primary">
                        <span>Crear cuenta</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </button>
                </form>
            </div>

            <div class="auth-modal-footer">
                <p class="auth-footer-text">
                    ¿Ya tienes cuenta?
                    <a href="javascript:void(0)" onclick="switchToLoginModal(); return false;" class="auth-footer-link-highlight">Iniciar sesión</a>
                </p>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="{% static 'css/autenticacion/modals/login.css' %}">
<link rel="stylesheet" href="{% static 'css/autenticacion/modals/registro.css' %}">

{% if abrir_modal_registro %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (typeof openRegistroModal === 'function') {
        openRegistroModal();
    }
});
</script>
{% endif %}
