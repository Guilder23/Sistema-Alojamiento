{% load static %}

<!-- Modal de Registro - Limpio y Funcional -->
<div id="modalRegistro" class="modal-registro">
    <div class="modal-overlay" onclick="closeRegistroModal()"></div>
    <div class="modal-dialog">
        <div class="modal-content">
            <!-- Header -->
            <div class="modal-header">
                <div class="modal-title-group">
                    <h2 class="modal-title">Crear Cuenta</h2>
                    <p class="modal-subtitle">Únete a nuestro sistema</p>
                </div>
                <button type="button" class="modal-close" onclick="closeRegistroModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Body - Formulario -->
            <div class="modal-body">
                <form method="post" action="{% url 'autenticacion:registro' %}" id="registroForm" novalidate>
                    {% csrf_token %}

                    <!-- Usuario -->
                    <div class="form-group">
                        <label for="reg_username" class="form-label">Usuario</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <input type="text" id="reg_username" name="username" class="form-control" placeholder="usuario" required>
                        </div>
                        <div class="error-message" id="reg_username-error"></div>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="reg_email" class="form-label">Correo Electrónico</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                            </svg>
                            <input type="email" id="reg_email" name="email" class="form-control" placeholder="correo@ejemplo.com" required>
                        </div>
                        <div class="error-message" id="reg_email-error"></div>
                    </div>

                    <!-- Contraseña -->
                    <div class="form-group">
                        <label for="reg_password1" class="form-label">Contraseña</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" id="reg_password1" name="password1" class="form-control" placeholder="••••••••" required>
                        </div>
                        <div class="error-message" id="reg_password1-error"></div>
                    </div>

                    <!-- Confirmar Contraseña -->
                    <div class="form-group">
                        <label for="reg_password2" class="form-label">Confirmar Contraseña</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                            <input type="password" id="reg_password2" name="password2" class="form-control" placeholder="••••••••" required>
                        </div>
                        <div class="error-message" id="reg_password2-error"></div>
                    </div>

                    <!-- Botón Enviar -->
                    <button type="submit" class="btn btn-primary">
                        <span>Crear Cuenta</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </button>
                </form>
            </div>

            <!-- Footer -->
            <div class="modal-footer">
                <div class="divider"></div>
                <p class="footer-text">
                    ¿Ya tienes cuenta?
                    <a href="javascript:void(0)" onclick="switchToLoginModal(); return false;" class="footer-link">Inicia sesión</a>
                </p>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="{% static 'css/autenticacion/modals/registro.css' %}">
