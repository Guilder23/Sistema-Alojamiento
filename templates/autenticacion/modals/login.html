{% load static %}

<!-- Modal de Login -->
<div id="modalLogin" class="modal" style="display: none;">
    <div class="modal-overlay" onclick="closeLoginModal()"></div>
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Iniciar Sesión</h2>
                <button class="modal-close" onclick="closeLoginModal()" type="button">&times;</button>
            </div>
            
            <div class="modal-body">
                <p class="modal-subtitle">Sistema de Gestión de Alojamiento</p>

                <form method="post" action="{% url 'autenticacion:login' %}" class="modal-form" novalidate id="loginForm">
                    {% csrf_token %}

                    <div class="form-group">
                        <label for="modal_username">Usuario o Email</label>
                        <input
                            type="text"
                            id="modal_username"
                            name="username"
                            placeholder="Tu usuario o correo"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="modal_password">Contraseña</label>
                        <input
                            type="password"
                            id="modal_password"
                            name="password"
                            placeholder="Tu contraseña"
                            required
                        >
                    </div>

                    <button type="submit" class="btn-submit">
                        Iniciar Sesión
                    </button>
                </form>

                <div class="modal-footer">
                    <p style="text-align: center; color: #666; margin: 15px 0;">
                        <a href="{% url 'autenticacion:password_reset' %}" style="color: #667eea; text-decoration: none;">¿Olvidaste tu contraseña?</a>
                    </p>
                    <p style="text-align: center; color: #666;">
                        ¿No tienes cuenta? 
                        <a href="javascript:void(0)" onclick="switchToRegistroModal(); return false;" style="color: #667eea; text-decoration: none; font-weight: 600;">Crear cuenta</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Estilos del Modal -->
<style>
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1000;
}

.modal-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
}

.modal-dialog {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 420px;
    z-index: 10;
    animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.modal-content {
    background: white;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    padding: 30px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 2px solid #f0f0f0;
    padding-bottom: 15px;
}

.modal-header h2 {
    margin: 0;
    color: #333;
    font-size: 24px;
}

.modal-close {
    background: none;
    border: none;
    font-size: 32px;
    color: #999;
    cursor: pointer;
    padding: 0;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s;
}

.modal-close:hover {
    color: #333;
}

.modal-body {
    margin: 20px 0;
}

.modal-subtitle {
    color: #666;
    text-align: center;
    margin-bottom: 20px;
    font-size: 14px;
}

.modal-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group label {
    color: #333;
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 14px;
}

.form-group input {
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 15px;
    transition: all 0.3s;
    font-family: inherit;
}

.form-group input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
}

.btn-submit {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    font-size: 16px;
    transition: all 0.2s;
}

.btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(102, 126, 234, 0.2);
}

.modal-footer {
    border-top: 1px solid #f0f0f0;
    padding-top: 15px;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translate(-50%, -48%);
    }
    to {
        opacity: 1;
        transform: translate(-50%, -50%);
    }
}

@media (max-width: 600px) {
    .modal-dialog {
        width: 95%;
    }
    
    .modal-content {
        padding: 20px;
    }
}
</style>

<script>
function openLoginModal() {
    const modal = document.getElementById('modalLogin');
    if (modal) {
        modal.style.display = 'block';
        document.body.style.overflow = 'hidden';
    }
}

function closeLoginModal() {
    const modal = document.getElementById('modalLogin');
    if (modal) {
        modal.style.display = 'none';
        document.body.style.overflow = 'auto';
    }
}

function switchToRegistroModal() {
    closeLoginModal();
    const registroModal = document.getElementById('modalRegistro');
    if (registroModal) {
        registroModal.style.display = 'block';
    }
}

// Cerrar con ESC
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeLoginModal();
    }
});
</script>
