<!-- Modal Confirmar Reserva -->
<div class="modal fade" id="modalConfirmar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">
                    <i class="fas fa-check-circle"></i> Confirmar Reserva
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="text-center mb-3">
                    <i class="fas fa-question-circle fa-4x text-success mb-3"></i>
                    <h5>¿Confirmar esta reserva?</h5>
                </div>
                <div class="alert alert-info">
                    <p class="mb-2"><strong>Habitación:</strong> <span id="confirmar-habitacion"></span></p>
                    <p class="mb-2"><strong>Cliente:</strong> <span id="confirmar-cliente"></span></p>
                    <p class="mb-2"><strong>Fechas:</strong> <span id="confirmar-fechas"></span></p>
                    <p class="mb-0"><strong>Total:</strong> <span id="confirmar-total"></span></p>
                </div>
                <p class="text-muted small">
                    <i class="fas fa-info-circle"></i> La reserva pasará a estado CONFIRMADA y el cliente será notificado.
                </p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="fas fa-times"></i> Cancelar
                </button>
                <button type="button" class="btn btn-success" id="btn-confirmar-final">
                    <i class="fas fa-check"></i> Sí, Confirmar
                </button>
            </div>
        </div>
    </div>
</div>
