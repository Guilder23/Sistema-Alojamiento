<!-- Modal Reservar -->
<div class="modal-overlay" id="modal-reserva-overlay"></div>
<div class="modal-content" id="modal-reserva" style="display: none;">
    <div class="modal-header">
        <h3><i class="fas fa-calendar-check"></i> Realizar Reserva</h3>
        <button class="close-modal" onclick="cerrarModalReserva()">&times;</button>
    </div>
    <div class="modal-body">
        <form id="form-reserva">
            <input type="hidden" id="reserva-habitacion-id">
            
            <div class="habitacion-reserva-info" id="habitacion-reserva-info">
                <!-- Información de la habitación seleccionada -->
            </div>

            <div class="form-group">
                <label for="reserva-fecha-inicio"><i class="fas fa-calendar"></i> Fecha de entrada <span class="required">*</span></label>
                <input type="date" id="reserva-fecha-inicio" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="reserva-fecha-fin"><i class="fas fa-calendar"></i> Fecha de salida <span class="required">*</span></label>
                <input type="date" id="reserva-fecha-fin" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="reserva-num-personas"><i class="fas fa-users"></i> Número de personas <span class="required">*</span></label>
                <input type="number" id="reserva-num-personas" class="form-control" min="1" required>
            </div>

            <div class="form-group">
                <label for="reserva-observaciones"><i class="fas fa-comment"></i> Observaciones</label>
                <textarea id="reserva-observaciones" class="form-control" rows="3" 
                          placeholder="Solicitudes especiales, hora estimada de llegada, etc."></textarea>
            </div>

            <div class="resumen-reserva" id="resumen-reserva" style="display: none;">
                <h4>Resumen de la reserva</h4>
                <div class="resumen-item">
                    <span>Noches:</span>
                    <strong id="resumen-noches">-</strong>
                </div>
                <div class="resumen-item">
                    <span>Precio por noche:</span>
                    <strong id="resumen-precio-noche">-</strong>
                </div>
                <div class="resumen-item total">
                    <span>Total:</span>
                    <strong id="resumen-total">-</strong>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="cerrarModalReserva()">Cancelar</button>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-check"></i> Confirmar Reserva
                </button>
            </div>
        </form>
    </div>
</div>
