{% load static %}

<!-- CSS del Navbar -->
<link rel="stylesheet" href="{% static 'css/componentes/navbar.css' %}">

<!-- Navegación Principal -->
<nav class="navbar" aria-label="Principal">
    <div class="navbar-container">
        <!-- Logo -->
        <div class="navbar-logo">
            <a href="/" class="navbar-brand-link">
                <span class="navbar-mark" aria-hidden="true">
                    <i class="fas fa-building"></i>
                </span>
                <span class="navbar-brand-text">
                    <span class="navbar-brand-name">SistemaAlojamiento</span>
                    <span class="navbar-brand-tag">Gestión de alojamientos</span>
                </span>
            </a>
        </div>

        <!-- Menu Toggle (Mobile) -->
        <button type="button" class="navbar-toggle" id="navbarToggle" aria-expanded="false" aria-controls="navbarMenu" aria-label="Abrir menú">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Navigation Menu -->
        <ul class="navbar-menu" id="navbarMenu">
            <li class="navbar-item">
                <a href="/" class="navbar-link">
                    <i class="fas fa-home" aria-hidden="true"></i><span>Inicio</span>
                </a>
            </li>
            
            {% if user.is_authenticated %}
                <!-- Usuario Autenticado -->
                <li class="navbar-item dropdown">
                    <a href="#" class="navbar-link dropdown-toggle" id="userDropdown">
                        <i class="fas fa-user-circle" aria-hidden="true"></i><span>{{ user.username }}</span>
                        <i class="fas fa-chevron-down navbar-chevron" aria-hidden="true"></i>
                    </a>
                    <ul class="dropdown-menu" id="userDropdownMenu">
                        <li><a href="#" class="dropdown-item">
                            <i class="fas fa-id-card"></i> Mi Perfil
                        </a></li>
                        <li><a href="{% url 'autenticacion:password_change' %}" class="dropdown-item">
                            <i class="fas fa-key"></i> Cambiar Contraseña
                        </a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a href="{% url 'autenticacion:logout' %}" class="dropdown-item">
                            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                        </a></li>
                    </ul>
                </li>
            {% else %}
                <!-- Usuario No Autenticado -->
                <li class="navbar-item navbar-item--cta">
                    <a href="javascript:void(0)" onclick="openLoginModal()" class="navbar-link navbar-link--ghost">
                        <i class="fas fa-sign-in-alt" aria-hidden="true"></i><span>Iniciar sesión</span>
                    </a>
                </li>
                <li class="navbar-item navbar-item--cta">
                    <a href="javascript:void(0)" onclick="openRegistroModal()" class="navbar-link btn-registro">
                        <i class="fas fa-user-plus" aria-hidden="true"></i><span>Crear cuenta</span>
                    </a>
                </li>
            {% endif %}
        </ul>
    </div>
</nav>

<!-- JavaScript del Navbar -->
<script src="{% static 'js/componentes/navbar.js' %}" defer></script>
