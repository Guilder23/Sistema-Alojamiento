<!-- Modal Crear Habitación -->
<div class="modal-overlay"></div>
<div class="modal-content" id="modal-crear-habitacion" style="display: none;">
    <div class="modal-header">
        <h3><i class="fas fa-door-open"></i> Crear Habitación</h3>
        <button class="close-modal" id="close-modal-crear-habitacion">&times;</button>
    </div>
    <div class="modal-body">
        <form id="form-crear-habitacion" novalidate>
            <div class="form-section">
                <div class="section-title"><i class="fas fa-circle-info"></i> Campos básicos</div>
            <div class="form-group">
                <label for="crear-numero">Número <span class="required">*</span></label>
                <div class="input-with-icon">
                    <span class="input-icon"><i class="fas fa-hashtag"></i></span>
                    <input type="text" id="crear-numero" class="form-control" required placeholder="Ej: 101">
                </div>
                <div class="form-error"></div>
            </div>

            <div class="form-group">
                <label for="crear-nombre">Nombre de habitación <span class="required">*</span></label>
                <div class="input-with-icon">
                    <span class="input-icon"><i class="fas fa-tag"></i></span>
                    <input type="text" id="crear-nombre" class="form-control" required placeholder="Ej: Habitación Doble Deluxe">
                </div>
                <div class="form-error"></div>
            </div>

            <div class="form-group">
                <label for="crear-tipo">Tipo <span class="required">*</span></label>
                <div class="input-with-icon">
                    <span class="input-icon"><i class="fas fa-bed"></i></span>
                    <select id="crear-tipo" class="form-control" required>
                        <option value="">Seleccionar tipo</option>
                        <option value="simple">Habitación Simple</option>
                        <option value="doble">Habitación Doble</option>
                        <option value="triple">Habitación Triple</option>
                        <option value="suite">Suite</option>
                        <option value="deluxe">Deluxe</option>
                        <option value="presidencial">Suite Presidencial</option>
                    </select>
                </div>
                <div class="form-error"></div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="crear-capacidad">Capacidad <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <span class="input-icon"><i class="fas fa-users"></i></span>
                        <input type="number" id="crear-capacidad" class="form-control" required min="1" placeholder="Ej: 2">
                    </div>
                    <div class="form-error"></div>
                </div>
                <div class="form-group">
                    <label for="crear-piso">Piso <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <span class="input-icon"><i class="fas fa-layer-group"></i></span>
                        <input type="number" id="crear-piso" class="form-control" required min="1" placeholder="Ej: 1">
                    </div>
                    <div class="form-error"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="crear-precio">Precio por Noche <span class="required">*</span></label>
                <div class="input-with-icon">
                    <span class="input-icon"><i class="fas fa-dollar-sign"></i></span>
                    <input type="number" id="crear-precio" class="form-control" required min="0" step="0.01" placeholder="Ej: 80.00">
                </div>
                <div class="form-error"></div>
            </div>

            <div class="form-group">
                <label for="crear-estado">Estado <span class="required">*</span></label>
                <div class="input-with-icon">
                    <span class="input-icon"><i class="fas fa-circle"></i></span>
                    <select id="crear-estado" class="form-control" required>
                        <option value="disponible">Disponible</option>
                        <option value="ocupada">Ocupada</option>
                        <option value="limpieza">En limpieza</option>
                        <option value="fuera_servicio">Fuera de servicio</option>
                    </select>
                </div>
                <div class="form-error"></div>
            </div>

            <div class="form-group">
                <label for="crear-tipo-bano">Tipo de Baño <span class="required">*</span></label>
                <div class="input-with-icon">
                    <span class="input-icon"><i class="fas fa-bath"></i></span>
                    <select id="crear-tipo-bano" class="form-control" required>
                        <option value="privado">Baño privado</option>
                        <option value="compartido">Baño compartido</option>
                        <option value="sin_bano">Sin baño</option>
                    </select>
                </div>
                <div class="form-error"></div>
            </div>

            <div class="form-group">
                <label for="crear-vista">Vista</label>
                <div class="input-with-icon">
                    <span class="input-icon"><i class="fas fa-mountain"></i></span>
                    <select id="crear-vista" class="form-control">
                        <option value="">Seleccionar vista</option>
                        <option value="mar">Mar</option>
                        <option value="ciudad">Ciudad</option>
                        <option value="jardin">Jardín</option>
                        <option value="montana">Montaña</option>
                        <option value="interior">Interior</option>
                        <option value="sin_vista">Sin vista</option>
                    </select>
                </div>
                <div class="form-error"></div>
            </div>

            <div class="form-group">
                <label for="crear-youtube">Video (YouTube)</label>
                <div class="input-with-icon">
                    <span class="input-icon"><i class="fab fa-youtube"></i></span>
                    <input type="url" id="crear-youtube" class="form-control" placeholder="https://www.youtube.com/watch?v=...">
                </div>
                <div class="form-error"></div>
            </div>

            <div class="form-group">
                <label for="crear-descripcion">Descripción</label>
                <div class="input-with-icon">
                    <span class="input-icon"><i class="fas fa-align-left"></i></span>
                    <textarea id="crear-descripcion" class="form-control" rows="3" placeholder="Detalles de la habitación..."></textarea>
                </div>
                <div class="form-error"></div>
            </div>

            <div class="form-group">
                <label for="crear-foto-principal">Imagen principal</label>
                <div class="file-upload">
                    <input type="file" id="crear-foto-principal" class="form-control" accept="image/*">
                </div>
                <div class="foto-preview" id="crear-foto-principal-preview" style="display:none;"><img id="crear-foto-principal-preview-img" alt="Preview"></div>
                <div class="form-error"></div>
            </div>

            <div class="form-group">
                <label for="crear-fotos">Galería de imágenes (máx 6)</label>
                <div class="galeria-container">
                    <div class="fotos-grid" id="crear-fotos-preview"></div>
                    <button type="button" class="btn-agregar-foto" id="btn-agregar-crear-foto" onclick="document.getElementById('crear-fotos').click()">
                        <i class="fas fa-plus"></i> Agregar imagen
                    </button>
                    <input type="file" id="crear-fotos" class="form-control" accept="image/*" style="display:none;">
                </div>
                <small class="form-help"><span id="crear-contador-fotos">0</span> de 6 imágenes</small>
                <div class="form-error"></div>
            </div>

            </div>

            <div class="form-section">
                <div class="section-title"><i class="fas fa-sliders"></i> Características</div>

                <div class="amenidades-section">
                    <div class="amenidades-title"><i class="fas fa-list-check"></i> Amenidades y Servicios</div>
                    <div class="amenidades-grid">
                        <label class="amenidad"><input type="checkbox" id="crear-bano-privado" checked> <span><i class="fas fa-bath"></i> Baño privado</span></label>
                        <label class="amenidad"><input type="checkbox" id="crear-tv" checked> <span><i class="fas fa-tv"></i> TV</span></label>
                        <label class="amenidad"><input type="checkbox" id="crear-internet" checked> <span><i class="fas fa-wifi"></i> Internet</span></label>
                        <label class="amenidad"><input type="checkbox" id="crear-acceso-youtube"> <span><i class="fab fa-youtube"></i> Acceso a YouTube</span></label>
                        <label class="amenidad"><input type="checkbox" id="crear-aire"> <span><i class="fas fa-snowflake"></i> Aire acondicionado</span></label>
                        <label class="amenidad"><input type="checkbox" id="crear-calefaccion"> <span><i class="fas fa-fire"></i> Calefacción</span></label>
                        <label class="amenidad"><input type="checkbox" id="crear-minibar"> <span><i class="fas fa-wine-bottle"></i> Minibar</span></label>
                        <label class="amenidad"><input type="checkbox" id="crear-caja"> <span><i class="fas fa-vault"></i> Caja fuerte</span></label>
                        <label class="amenidad"><input type="checkbox" id="crear-escritorio"> <span><i class="fas fa-chair"></i> Escritorio</span></label>
                        <label class="amenidad"><input type="checkbox" id="crear-armario" checked> <span><i class="fas fa-shirt"></i> Armario</span></label>
                        <label class="amenidad"><input type="checkbox" id="crear-agua" checked> <span><i class="fas fa-droplet"></i> Agua caliente</span></label>
                        <label class="amenidad"><input type="checkbox" id="crear-toallas" checked> <span><i class="fas fa-bath"></i> Toallas</span></label>
                        <label class="amenidad"><input type="checkbox" id="crear-papel" checked> <span><i class="fas fa-toilet-paper"></i> Papel higiénico</span></label>
                        <label class="amenidad"><input type="checkbox" id="crear-shampoo"> <span><i class="fas fa-pump-soap"></i> Shampoo</span></label>
                        <label class="amenidad"><input type="checkbox" id="crear-secador"> <span><i class="fas fa-wind"></i> Secador de cabello</span></label>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="section-title"><i class="fas fa-bed"></i> Camas</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="crear-numero-camas">Número de camas <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <span class="input-icon"><i class="fas fa-layer-group"></i></span>
                            <input type="number" id="crear-numero-camas" class="form-control" required min="1" value="1">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="crear-tipo-cama">Tipo de cama <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <span class="input-icon"><i class="fas fa-moon"></i></span>
                            <select id="crear-tipo-cama" class="form-control" required>
                                <option value="single">Single</option>
                                <option value="queen">Queen</option>
                                <option value="king">King</option>
                                <option value="mixta">Mixta</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="section-title"><i class="fas fa-calendar-check"></i> Configuración de reservas</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="crear-min-noches">Reserva mínima (noches) <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <span class="input-icon"><i class="fas fa-minus"></i></span>
                            <input type="number" id="crear-min-noches" class="form-control" required min="1" value="1">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="crear-max-noches">Reserva máxima (noches) <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <span class="input-icon"><i class="fas fa-plus"></i></span>
                            <input type="number" id="crear-max-noches" class="form-control" required min="1" value="30">
                        </div>
                    </div>
                </div>
                <div class="form-grid">
                    <label class="amenidad"><input type="checkbox" id="crear-mascotas"> <span><i class="fas fa-paw"></i> Permite mascotas</span></label>
                    <label class="amenidad"><input type="checkbox" id="crear-fumar"> <span><i class="fas fa-smoking"></i> Permite fumar</span></label>
                </div>
                <div class="form-group">
                    <label for="crear-precio-fin">Precio fin de semana (opcional)</label>
                    <div class="input-with-icon">
                        <span class="input-icon"><i class="fas fa-calendar"></i></span>
                        <input type="number" id="crear-precio-fin" class="form-control" min="0" step="0.01" placeholder="Ej: 100.00">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="cerrarModalHabitaciones('modal-crear-habitacion')">Cancelar</button>
        <button type="submit" form="form-crear-habitacion" class="btn btn-primary">
            <i class="fas fa-save"></i> Crear Habitación
        </button>
    </div>
</div>
