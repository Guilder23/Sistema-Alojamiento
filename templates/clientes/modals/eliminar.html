<!-- Modal Eliminar Cliente -->
<div class="modal-overlay"></div>
<div class="modal-content" id="modal-eliminar-cliente" style="display: none;">
    <div class="modal-header">
        <h3><i class="fas fa-exclamation-triangle"></i> Eliminar Cliente</h3>
        <button class="close-modal" id="close-modal-eliminar">&times;</button>
    </div>
    <div class="modal-body">
        <div class="confirm-message">
            <i class="fas fa-exclamation-circle"></i>
            <p>Estas seguro de que deseas eliminar el cliente?</p>
            <p class="confirm-username" id="eliminar-nombre"></p>
            <div class="confirm-warning">
                <i class="fas fa-info-circle"></i> Esta accion no se puede deshacer
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-secondary" id="btn-cancelar-eliminar"><i class="fas fa-times"></i> Cancelar</button>
        <button class="btn btn-danger" id="btn-confirmar-eliminar">
            <i class="fas fa-trash"></i> Eliminar Permanentemente
        </button>
    </div>
</div>
