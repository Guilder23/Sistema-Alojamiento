<!-- Modal Ver Cliente -->
<div class="modal-overlay"></div>
<div class="modal-content" id="modal-ver-cliente" style="display: none;">
    <div class="modal-header">
        <h3><i class="fas fa-user"></i> Detalles del Cliente</h3>
        <button class="close-modal" id="close-modal-ver">&times;</button>
    </div>
    <div class="modal-body">
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-hashtag"></i> ID</div>
            <div class="detail-value" id="ver-id">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-user"></i> Cliente</div>
            <div class="detail-value" id="ver-nombre-completo">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-id-card"></i> Documento</div>
            <div class="detail-value" id="ver-documento">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-phone"></i> Telefono</div>
            <div class="detail-value" id="ver-telefono">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-envelope"></i> Email</div>
            <div class="detail-value" id="ver-email">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-flag"></i> Pais</div>
            <div class="detail-value" id="ver-pais">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-city"></i> Ciudad</div>
            <div class="detail-value" id="ver-ciudad">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-map-marked-alt"></i> Direccion</div>
            <div class="detail-value" id="ver-direccion">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-circle"></i> Estado</div>
            <div class="detail-value" id="ver-estado">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-calendar-plus"></i> Fecha de Registro</div>
            <div class="detail-value" id="ver-fecha-registro">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-clock"></i> Ultima Actualizacion</div>
            <div class="detail-value" id="ver-actualizado">-</div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="cerrarModal('modal-ver-cliente')">Cerrar</button>
    </div>
</div>
