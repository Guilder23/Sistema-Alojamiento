<!-- Modal Ver Usuario -->
<div class="modal-overlay"></div>
<div class="modal-content" id="modal-ver-usuario" style="display: none;">
    <div class="modal-header">
        <h3><i class="fas fa-user"></i> Detalles del Usuario</h3>
        <button class="close-modal" id="close-modal-ver">&times;</button>
    </div>
    <div class="modal-body">
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-hashtag"></i> ID</div>
            <div class="detail-value" id="ver-id">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-user"></i> Usuario</div>
            <div class="detail-value" id="ver-username">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-envelope"></i> Email</div>
            <div class="detail-value" id="ver-email">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-briefcase"></i> Rol</div>
            <div class="detail-value" id="ver-rol">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-circle"></i> Estado</div>
            <div class="detail-value" id="ver-estado">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-calendar-plus"></i> Fecha de Registro</div>
            <div class="detail-value" id="ver-fecha-registro">-</div>
        </div>
        <div class="detail-group">
            <div class="detail-label"><i class="fas fa-clock"></i> Último Acceso</div>
            <div class="detail-value" id="ver-ultimo-acceso">-</div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="cerrarModal('modal-ver-usuario')">Cerrar</button>
    </div>
</div>
