<!-- Modal Crear Usuario -->
<div class="modal-overlay"></div>
<div class="modal-content" id="modal-crear-usuario" style="display: none;">
    <div class="modal-header">
        <h3><i class="fas fa-user-plus"></i> Crear Nuevo Usuario</h3>
        <button class="close-modal" id="close-modal-crear">&times;</button>
    </div>
    <div class="modal-body">
        <form id="form-crear-usuario">
            <div class="form-group">
                <label for="crear-username">Nombre de Usuario <span class="required">*</span></label>
                <div class="input-with-icon">
                    <span class="input-icon"><i class="fas fa-user"></i></span>
                    <input type="text" id="crear-username" class="form-control" required placeholder="Ej: juan.garcia">
                </div>
                <div class="form-error"></div>
            </div>
            <div class="form-group">
                <label for="crear-email">Email <span class="required">*</span></label>
                <div class="input-with-icon">
                    <span class="input-icon"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="crear-email" class="form-control" required placeholder="Ej: juan@hotel.com">
                </div>
                <div class="form-error"></div>
            </div>
            <div class="form-group">
                <label for="crear-rol">Rol <span class="required">*</span></label>
                <div class="input-with-icon">
                    <span class="input-icon"><i class="fas fa-briefcase"></i></span>
                    <select id="crear-rol" class="form-control" required>
                        <option value="">Seleccionar rol</option>
                        <option value="administrador">Administrador</option>
                        <option value="recepcionista">Recepcionista</option>
                        <option value="gerente">Gerente</option>
                        <option value="empleado_limpieza">Empleado de Limpieza</option>
                    </select>
                </div>
                <div class="form-error"></div>
            </div>
            <div class="password-grid">
                <div class="form-group">
                    <label for="crear-password">Contraseña <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input type="password" id="crear-password" class="form-control" required placeholder="Mínimo 6 caracteres">
                    </div>
                    <div class="form-error"></div>
                </div>
                <div class="form-group">
                    <label for="crear-password-confirm">Confirmar Contraseña <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <span class="input-icon"><i class="fas fa-shield-alt"></i></span>
                        <input type="password" id="crear-password-confirm" class="form-control" required placeholder="Repetir contraseña">
                    </div>
                    <div class="form-error"></div>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="cerrarModal('modal-crear-usuario')">Cancelar</button>
        <button type="submit" form="form-crear-usuario" class="btn btn-primary">
            <i class="fas fa-save"></i> Crear Usuario
        </button>
    </div>
</div>
