<!-- Modal Crear Nuevo Usuario -->
<div id="modalCrearUsuario" class="modal-backdrop" style="display: none;">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-user-plus"></i> Crear Nuevo Usuario</h5>
                <button type="button" class="btn-close" onclick="cerrarModal('modalCrearUsuario')"></button>
            </div>
            <form id="crearUsuarioForm" onsubmit="guardarUsuario(event)" class="modal-form">
                <input type="hidden" name="csrfmiddlewaretoken" value="">
                
                <div class="form-group">
                    <label for="crearUsername"><i class="fas fa-user"></i> Usuario</label>
                    <input type="text" id="crearUsername" name="username" class="form-control" placeholder="Nombre de usuario" required>
                    <small class="text-muted">Sin espacios, solo letras y números</small>
                </div>
                
                <div class="form-group">
                    <label for="crearEmail"><i class="fas fa-envelope"></i> Correo</label>
                    <input type="email" id="crearEmail" name="email" class="form-control" placeholder="correo@ejemplo.com" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="crearNombre"><i class="fas fa-address-card"></i> Nombre</label>
                        <input type="text" id="crearNombre" name="first_name" class="form-control" placeholder="Nombre">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="crearApellido"><i class="fas fa-address-card"></i> Apellido</label>
                        <input type="text" id="crearApellido" name="last_name" class="form-control" placeholder="Apellido">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="crearPassword"><i class="fas fa-lock"></i> Contraseña</label>
                        <input type="password" id="crearPassword" name="password" class="form-control" placeholder="Mínimo 8 caracteres" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="crearPassword2"><i class="fas fa-lock"></i> Confirmar</label>
                        <input type="password" id="crearPassword2" name="password2" class="form-control" placeholder="Repite la contraseña" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="crearRol"><i class="fas fa-briefcase"></i> Rol</label>
                    <select id="crearRol" name="rol" class="form-control" required>
                        <option value="">-- Selecciona un rol --</option>
                        <option value="admin">Administrador</option>
                        <option value="gerente">Gerente</option>
                        <option value="recepcionista">Recepcionista</option>
                        <option value="limpieza">Personal de Limpieza</option>
                        <option value="cliente">Cliente</option>
                    </select>
                </div>
                
                <div class="form-group form-check">
                    <input type="checkbox" id="crearActivo" name="is_active" checked>
                    <label class="form-check-label" for="crearActivo">
                        <i class="fas fa-check-circle"></i> Usuario Activo
                    </label>
                </div>
                
                <div id="crearErrors" class="alert alert-danger" style="display: none;"></div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="cerrarModal('modalCrearUsuario')">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Crear Usuario
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
