<!-- Modal Editar QR -->
<div class="modal fade" id="modalEditarQR" tabindex="-1" aria-labelledby="modalEditarQRLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalEditarQRLabel">
                    <i class="fas fa-edit"></i> Editar Configuración QR
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="formEditarQR" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="hidden" id="qr_id_editar" name="qr_id">
                <div class="modal-body">
                    <!-- Descripción -->
                    <div class="form-group group-half">
                        <label for="descripcion_editar" class="form-label">
                            Descripción del Método de Pago <span class="required">*</span>
                        </label>
                        <div class="input-with-icon">
                            <span class="input-icon"><i class="fas fa-align-left"></i></span>
                            <input type="text" class="form-control" id="descripcion_editar" name="descripcion" required>
                        </div>
                    </div>

                    <!-- Código QR -->
                    <div class="form-group group-half">
                        <label for="codigo_qr_editar" class="form-label">
                            Código/Datos del QR <span class="required">*</span>
                        </label>
                        <div class="input-with-icon textarea-with-icon">
                            <span class="input-icon"><i class="fas fa-key"></i></span>
                            <textarea class="form-control" id="codigo_qr_editar" name="codigo_qr" rows="4" required></textarea>
                        </div>
                    </div>

                    <!-- Nueva Imagen QR -->
                    <div class="form-group group-half">
                        <label for="imagen_qr_editar" class="form-label">
                            Cambiar Imagen del QR (Opcional)
                        </label>
                        <input type="file" class="form-control" id="imagen_qr_editar" name="imagen_qr" accept="image/*">
                        <small class="text-muted">Deja vacío para mantener la imagen actual</small>
                    </div>

                    <!-- Bloque de imágenes -->
                    <div class="form-group group-full">
                        <div class="imagenes-grid">
                            <div id="imagen_actual_container" class="imagen-card">
                                <label class="form-label">Imagen QR Actual</label>
                                <div class="text-center">
                                    <img id="qr_actual_img" src="" alt="QR Actual" style="max-width: 200px; border: 1px solid #ddd; padding: 10px;">
                                    <p id="qr_actual_sin_imagen" class="text-muted mt-2 mb-0" style="display:none;">Sin imagen actual</p>
                                </div>
                            </div>

                            <div id="preview_editar" class="imagen-card" style="display:none;">
                                <label class="form-label">Vista Previa Nueva Imagen</label>
                                <div class="text-center">
                                    <img id="preview_img_editar" src="" alt="Preview" style="max-width: 200px; border: 1px solid #ddd; padding: 10px;">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Regenerar QR -->
                    <div class="checkbox-group group-full">
                        <div class="form-check m-0">
                            <input class="form-check-input" type="checkbox" id="regenerar_qr" name="regenerar_qr" value="true">
                            <label class="form-check-label" for="regenerar_qr">
                                <i class="fas fa-sync"></i> Regenerar QR automáticamente desde el código
                            </label>
                        </div>
                    </div>

                    <!-- Estado -->
                    <div class="form-group group-half">
                        <label class="form-label">
                            Estado
                        </label>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="estado_editar" name="estado" value="activo">
                            <label class="form-check-label" for="estado_editar">
                                Configuración activa (los clientes verán este QR)
                            </label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Actualizar Configuración
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
